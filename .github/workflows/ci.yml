name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build and pack
        run: python3 tools/pack_site.py --site-url https://nullhollow.github.io/zzz-measurements/

      - name: Validate data, pages, links and structured data
        run: python3 tools/validate.py --site-url https://nullhollow.github.io/zzz-measurements/

      - name: Exploration regression and Python/JS parity
        run: |
          python3 tools/test_analysis.py
          python3 tools/test_roster.py

      - name: Theme preferences and palette contrast
        run: python3 tools/test_theme.py

      - name: Rebuild is reproducible
        run: |
          git diff --stat
          git diff --exit-code -- docs index.html tools.html tools/data.json

      - name: Upload packed site
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
          retention-days: 7
